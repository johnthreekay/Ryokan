<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryokan - Login</title>
    <link rel="stylesheet" href="/static/css/base.css?v={{ crate::asset_version() }}">
    <link rel="stylesheet" href="/static/css/forms.css?v={{ crate::asset_version() }}">
    <link rel="stylesheet" href="/static/css/pages/auth.css?v={{ crate::asset_version() }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1 class="auth-brand">旅館 Ryokan</h1>
        <p class="auth-sub">Sign in to continue</p>
        {% if let Some(err) = error %}
            <div class="alert alert-error">{{ err }}</div>
        {% endif %}
        <form method="post" action="/login" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <p class="auth-forgot"><a href="/forgot-password">Forgot password?</a></p>
    </div>
</body>
</html>
