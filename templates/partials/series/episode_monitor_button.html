<button class="ep-mon-btn {% if ep.monitored %}ep-mon-yes{% else %}ep-mon-no{% endif %}"
    type="button"
    hx-post="/api/library/episode-monitoring"
    hx-vals='{"series_id": {{ id }}, "episode_number": {{ ep.number }}, "monitored": {% if ep.monitored %}false{% else %}true{% endif %}}'
    hx-target="this"
    hx-swap="outerHTML"
    title="{% if ep.monitored %}Unmonitor{% else %}Monitor{% endif %}">
    {% if ep.monitored %}Yes{% else %}No{% endif %}
</button>
