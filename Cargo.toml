[package]
name = "ryokan"
version = "1.9.2"
edition = "2024"
authors = ["John K"]
license = "GPL-3.0-or-later"
rust-version = "1.95"

[features]
# Opt-in re-export of `crate::test_support::*` as a public module so
# integration tests under `tests/` can drive the same in-memory pool,
# AppState scaffolding, and seeding helpers unit tests already rely on.
# Without the flag `test_support` stays crate-private; with it the
# module is visible to dependents (i.e. integration test targets).
# Not enabled by default — release binaries and Docker images compile
# without the helpers. CI flips it on for the test step.
test-support = []

# Browser-driving e2e tests for HTMX UI flows. Opt-in because they
# require a running geckodriver (or chromedriver) on localhost:4444
# + a Firefox/LibreWolf binary, and pull `fantoccini` into the
# dev-dep tree. NOT enabled in CI — they're a local-iteration tool.
# Run locally with:
#   geckodriver --port=4444 &
#   cargo test --features browser-e2e --test htmx_browser_e2e
browser-e2e = ["dep:fantoccini"]

# Each integration test target under `tests/` lists the `test-support`
# feature in `required-features` so a plain `cargo test` (without the
# flag) silently skips them instead of failing the build. This keeps
# the crate buildable both ways: production/Docker builds stay clean,
# and CI's `cargo test --features test-support` picks up everything.
[[test]]
name = "htmx_foundation"
path = "tests/htmx_foundation.rs"
required-features = ["test-support"]

[[test]]
name = "htmx_settings_delete"
path = "tests/htmx_settings_delete.rs"
required-features = ["test-support"]

[[test]]
name = "htmx_settings_modal_handlers"
path = "tests/htmx_settings_modal_handlers.rs"
required-features = ["test-support"]

[[test]]
name = "htmx_redirect_audit"
path = "tests/htmx_redirect_audit.rs"
required-features = ["test-support"]

[[test]]
name = "htmx_grab_bag"
path = "tests/htmx_grab_bag.rs"
required-features = ["test-support"]

[[test]]
name = "external_sync_e2e"
path = "tests/external_sync_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "library_link_e2e"
path = "tests/library_link_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "manual_import_e2e"
path = "tests/manual_import_e2e.rs"
