name: Publish Docker image

# Every branch push builds and publishes a multi-arch image tagged with
# the branch name (`feat/foo` -> `:feat-foo`), so a PR from this repo
# has a pullable image the moment it is pushed; `main` and `dev` keep
# their tags, semver tags publish releases and `latest`. `gh-pages` is
# the docs deploy target and has no Dockerfile.
#
# The `pull_request` trigger is for fork PRs, whose branches live
# outside this repo and never fire the push event. A fork PR's token
# cannot write to GHCR (and must not: the Dockerfile runs the
# contributor's code), so that path builds the same image, runs the
# same smoke test, and uploads a `docker load`-able tarball per
# platform as a workflow artifact instead of pushing. The job-level
# `if` skips same-repo PRs so they are not built twice.
on:
  push:
    branches: [ "**", "!gh-pages" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lowercased because GHCR requires lowercase image names and the repo is "Ryokan".
  IMAGE_NAME: johnthreekay/ryokan

jobs:
  # Per-platform job: builds the image on a native runner for its target
  # architecture. On a push it pushes a digest-only reference to GHCR
  # (tags are attached in the merge job below); on a fork PR it writes
  # the image to a tarball and uploads it as an artifact.
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare platform pair and mode
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PUSH_IMAGE=false" >> $GITHUB_ENV
            echo "PR_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          else
            echo "PUSH_IMAGE=true" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image name/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        if: env.PUSH_IMAGE == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Build to a tarball (fork PR)
        if: env.PUSH_IMAGE == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PR_TAG }}
          outputs: type=docker,dest=${{ runner.temp }}/ryokan-${{ env.PR_TAG }}-${{ env.PLATFORM_PAIR }}.tar
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Resolve the image to smoke test
        if: matrix.platform == 'linux/amd64'
        run: |
          if [ "$PUSH_IMAGE" = "true" ]; then
            echo "SMOKE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> $GITHUB_ENV
          else
            docker load -i "${{ runner.temp }}/ryokan-${PR_TAG}-${PLATFORM_PAIR}.tar"
            echo "SMOKE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PR_TAG}" >> $GITHUB_ENV
          fi

      - name: Smoke test amd64 image
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run -d --name ryokan-smoke \
            -e LISTEN_ADDR=0.0.0.0:8978 \
            -p 8978:8978 \
            "$SMOKE_IMAGE"
          # Probe /login (matches the production HEALTHCHECK). 200 means
          # the auth UI rendered; anything else fails. Polling loop
          # rather than fixed sleep so a fast cold-boot doesn't waste a
          # full minute on every CI run.
          #
          # `|| code=000` is load-bearing: GitHub Actions runs `run`
          # blocks under `set -eo pipefail`, so a curl error inside a
          # command substitution (connection refused = 7, broken
          # response = 56, etc.) propagates through and kills the
          # whole loop before the next sleep. Cold-boot races
          # naturally produce both — the kernel accepts the TCP
          # connection the moment Axum binds, but a few hundred ms
          # before the router is actually serving, curl can get an
          # incomplete response. Without the swallow we observed exit
          # 56 on run 25254999207 even though the container came up
          # fine ~2-3s later. The `000` sentinel keeps the loop
          # iterating; a real "never came up" still falls out the
          # bottom and reports the last code.
          # Accept 200 OR 303 as "up": a fresh container with no
          # users yet redirects `/login` → `/setup` (303), which is
          # correct behavior on first boot. The previous strict
          # 200-only check failed every fresh-image smoke test and
          # masked the actual question we want to answer ("did
          # Ryokan boot and start serving?"). 4xx/5xx still fall
          # through to the failure path.
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8978/login || echo 000)
            case "$code" in
              200|303)
                echo "Ryokan /login responded $code (Ryokan is up)"
                exit 0
                ;;
            esac
            sleep 1
          done
          echo "Ryokan never came up (last code: $code)"
          docker logs ryokan-smoke
          exit 1

      - name: Tear down smoke-test container
        if: always() && matrix.platform == 'linux/amd64'
        run: docker rm -f ryokan-smoke || true

      - name: Export digest
        if: env.PUSH_IMAGE == 'true'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH_IMAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # A fork PR's image is only reachable here: download the artifact
      # from the run, `docker load -i` the tarball, and run
      # `ghcr.io/johnthreekay/ryokan:pr-<n>`.
      - name: Upload image tarball (fork PR)
        if: env.PUSH_IMAGE == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ryokan-${{ env.PR_TAG }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/ryokan-${{ env.PR_TAG }}-${{ env.PLATFORM_PAIR }}.tar
          if-no-files-found: error
          retention-days: 14

  # Merge job: pulls the per-platform digests and stitches them into a
  # single multi-arch manifest list under the real tags (branch, semver,
  # latest). Docker pulls on amd64 and arm64 hosts pick the matching
  # platform transparently. Not run for fork PRs, which push nothing.
  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        # Pinned to v7 to match `upload-artifact@v7` above. v8 of
        # download-artifact exists but there's no v8 of upload-artifact
        # yet, and v7↔v8 mixing has produced ambiguous archives in the
        # past (compression-default change between majors).
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
