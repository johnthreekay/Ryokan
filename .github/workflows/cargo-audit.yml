name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
  schedule:
    - cron: "0 9 * * 1"

# Two rapid main pushes (or a main push that races a Cargo.lock PR
# merge) used to spawn parallel audit jobs that posted duplicate
# advisory comments. Cancel any in-flight audit on the same ref when a
# new run starts. Doesn't apply across refs, so the weekly cron and a
# main push can still run concurrently if they overlap.
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

# `rustsec/audit-check@v2` posts advisory results via the Checks API
# and opens issue comments on the PR it's running against. Without
# these write scopes the action still runs the audit, but the final
# "create check run" call fails with "Resource not accessible by
# integration" and the step errors out. Granted at the workflow level
# so scheduled / main-push runs can also post through.
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # The advisory DB fetch + Cargo.lock walk runs in ~30s steady-state.
    # 10 min is generous headroom against an advisory-DB clone hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
