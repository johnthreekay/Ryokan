name: Rust

# Every branch push runs the verify pass, so a feature branch has
# checks before its PR is opened and a PR into `dev` (which used to
# get nothing) shows them on its head commit. `gh-pages` is the docs
# deploy target and has no Cargo project; pushes there come from the
# docs workflow's GITHUB_TOKEN, which never triggers other workflows,
# so the exclusion is belt and braces. The `pull_request` trigger is
# kept for fork PRs, whose branches live outside this repo and never
# fire the push event; the job-level `if` below skips it for same-repo
# PRs so those don't run twice.
on:
  push:
    branches: [ "**", "!gh-pages" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# Default token scope. The fmt/clippy/build/test job only needs to read
# repo contents — the previous absence of an explicit block defaulted
# to GitHub's permissive token (write to most scopes), which is
# excessive for a CI verify pass.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # GitHub's per-job default is 6h; the verify pass should never
    # exceed ~10 min on ubuntu-latest, so 30 min is a generous ceiling
    # that still terminates a hung step (e.g. a flaky wiremock binding
    # eating the runner) before it burns hours of runner minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # mold is the linker pinned in `.cargo/config.toml` for linux
      # targets; CI's ubuntu-latest doesn't ship it preinstalled, so
      # without this step every link step would fail with
      # "linker `clang` not found" / "ld.mold not found". apt install
      # is fast (~5s) and mold itself cuts incremental link time
      # 3-5x — pays for itself many times over across the four cargo
      # invocations below.
      - name: Install mold + clang
        run: sudo apt-get update && sudo apt-get install -y mold clang
      # nextest is the parallel test runner pinned in `.config/nextest.toml`
      # — runs ~1900 tests roughly 2x faster than `cargo test` thanks
      # to a process-per-test scheduler and a less serialized fixture
      # boot. taiki-e/install-action grabs a precompiled binary from
      # the GitHub release rather than building from source (~20s vs
      # ~2 min via cargo install).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format check
        run: cargo fmt --all -- --check
      # `licenses/THIRD_PARTY_LICENSES.html` is regenerated and
      # auto-committed by `.github/workflows/license-notices.yml` on
      # push to `dev` when Cargo.lock changes. No freshness check
      # here — contributors never need to run `cargo about generate`
      # locally; the dedicated workflow keeps the file current.
      - name: Clippy
        # `--features test-support` enables the `ryokan::test_support`
        # re-export that integration tests under `tests/` depend on.
        # Without the flag those tests silently skip (via
        # `required-features` in Cargo.toml) and clippy wouldn't touch
        # them — running with the flag means the lint pass covers both
        # unit and integration targets.
        run: cargo clippy --workspace --all-targets --features test-support -- -D warnings
      - name: Build
        run: cargo build --workspace --locked --verbose
      - name: Test
        # Same reason as clippy: flip on `test-support` so integration
        # tests under `tests/` actually execute. Release builds and
        # Docker images deliberately leave the feature off so the test
        # helpers don't ship to production.
        # `--profile ci` picks up the JUnit-output + retry-twice
        # profile in `.config/nextest.toml` so flaky port-bind / DNS
        # races don't fail the whole run.
        run: cargo nextest run --workspace --locked --features test-support --profile ci

  msrv:
    # Verify the crate still builds on the declared MSRV. Cargo.toml's
    # `rust-version = "1.95"` is otherwise decorative — the main `build`
    # job uses `stable`, so a dep bump that silently requires a newer
    # toolchain would pass CI while leaving users pinned to 1.95 stranded.
    # Build-only (no test / clippy / fmt) because those produce
    # noisy MSRV-unrelated churn on older toolchains and the signal we
    # care about here is strictly "does the code compile on 1.95?"
    name: MSRV (1.95)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # MSRV build is just `cargo build --workspace --locked` — even on a
    # cold cache it runs in ~5 min. 20 min ceiling guards against a
    # hung dep download.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # The repo's `.cargo/config.toml` pins clang+mold as the linker
      # on linux targets; this job inherits that config and would fail
      # at link-time without them.
      - name: Install mold + clang
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - name: Build on MSRV
        run: cargo build --workspace --locked --verbose
