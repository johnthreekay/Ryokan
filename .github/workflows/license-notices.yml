# Regenerate `licenses/THIRD_PARTY_LICENSES.html` and auto-commit
# back to the branch when it drifts. Triggered on push to `dev` when
# Cargo.lock or about.toml/about.hbs (the cargo-about config) changes.
#
# Why a dedicated workflow rather than failing rust.yml's build:
#
#   * `cargo about generate` is a mechanical operation. Failing CI and
#     making contributors regen-and-commit locally is friction without
#     payoff — every dep bump produces drift, and the workflow's output
#     is byte-deterministic given the lockfile.
#   * The HTML file is the user-facing "find third-party notices on
#     GitHub" deliverable that README links to. It needs to stay
#     committed so the README link resolves on the repo's main view,
#     but it doesn't need human curation.
#
# This runs only on push to `dev` (not PRs) because workflows running
# on PRs from forks don't have write access to the repo. A PR that
# bumps Cargo.lock will land on `dev` after merge; this workflow then
# regenerates and commits the licenses-file refresh as a follow-up
# `chore:` commit. Same pattern Sonarr / `dependabot` use for similar
# auto-maintenance tasks.
#
# Supply chain: the third-party actions (toolchain, cache, cargo-about
# install) run in `generate`, which holds a read-only token; an action
# can read the job's token through its own input defaults, so keeping
# them out of the job that can push is what matters. `commit` holds
# `contents: write` and runs only first-party actions. Every action is
# pinned to a commit SHA, and install-action's manifest at that commit
# pins cargo-about's version and checksum.

name: Refresh third-party license notices

on:
  push:
    branches: [dev]
    paths:
      - Cargo.lock
      - about.toml
      - about.hbs
      - .github/workflows/license-notices.yml
  workflow_dispatch:

# Two rapid Cargo.lock pushes don't both need to run. Cancel any
# in-flight regen when a new push lands.
concurrency:
  group: license-notices
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: license-notices
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-about
      - name: Regenerate licenses/THIRD_PARTY_LICENSES.html
        run: |
          cargo about generate \
            -c about.toml about.hbs \
            -o licenses/THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: licenses/THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The checkout keeps the workflow's own token for the push back to
      # `dev`; no PAT is needed for the same repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: third-party-licenses
          path: licenses
      - name: Commit and push if changed
        run: |
          if git diff --quiet licenses/THIRD_PARTY_LICENSES.html; then
            echo "licenses/THIRD_PARTY_LICENSES.html is already current; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add licenses/THIRD_PARTY_LICENSES.html
          # `[skip ci]` so this commit doesn't trigger another rust.yml
          # run — the file change is mechanical and doesn't need to
          # re-run the full verify chain (clippy / nextest / build).
          # The next non-licenses commit will exercise CI normally.
          git commit -m "chore: regenerate THIRD_PARTY_LICENSES.html [skip ci]"
          git push origin HEAD:dev
