name: Bug report
description: Something's broken or behaving unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Ryokan is a single-maintainer project, so the more of this you fill in, the faster it can be looked at. A report with no logs and no version is unlikely to go anywhere.

        If you just have a question or a configuration problem, that's not a bug. Check the [docs](https://johnthreekay.github.io/Ryokan/docs/) first, or open a [discussion](https://github.com/johnthreekay/Ryokan/discussions) instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file this
      description: Both are required.
      options:
        - label: I've searched the [open and closed issues](https://github.com/johnthreekay/Ryokan/issues?q=is%3Aissue) and this isn't a duplicate.
          required: true
        - label: I'm running the latest release (only the latest release line gets fixes - see if upgrading resolves it first).
          required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: What's happening
      description: What did you do, and what happened that shouldn't have?
      placeholder: "After clicking Grab on episode 3, the row stays at 0% forever..."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What you expected instead
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add series X to the library
        2. Open the series page, click Grab on episode 3
        3. ...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in everything that applies. Settings → General → About shows the running version; `git rev-parse HEAD` if you built from source.
      value: |
        - Ryokan version:
        - Install method: <!-- Docker (which image tag - latest, a pinned version, ...?) / built from source -->
        - Behind a reverse proxy?: <!-- no, or which one (nginx, Caddy, Traefik, ...) -->
        - RYOKAN_* variables set: <!-- e.g. RYOKAN_TRUSTED_PROXY, RYOKAN_COOKIE_SECURE, RYOKAN_HOST_CHECK, RYOKAN_ALLOWED_HOSTS, RYOKAN_FRAME_ANCESTORS; names only, never a key -->
        - Download client(s) + version:
        - Host OS / arch:
        - Browser (if it's a UI issue):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        **Required for most bug reports.** Run with `RUST_LOG=ryokan=debug` (`ryokan=trace` for the most detail) and paste the lines around the failure. System → Logs shows the same lines, filterable by category, when `RYOKAN_DB_LOG_LEVEL=debug` is set (it keeps `info` and above by default). **Redact any API keys / passwords / tokens first.** If the output is large, put it in a [gist](https://gist.github.com/) and link it instead of pasting.
      render: text
    validations:
      required: true
