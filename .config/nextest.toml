# cargo-nextest configuration. nextest reads this automatically when
# invoked from the workspace root. Install: `cargo install cargo-nextest --locked`.
#
# Run the suite with `cargo nextest run --features test-support`.

[profile.default]
# Retry a failure once, so a flaky wiremock port-bind shows as FLAKY
# instead of failing the whole run. (`cargo test` never retries; this
# is nextest's own retry.)
retries = 1

# Show test output for failures only: clean signal during the
# ~3,100-test pass, full detail when something breaks.
failure-output = "immediate-final"
success-output = "never"

# Slow-test threshold: warn after 60s, terminate after 180s. Catches
# a hung wiremock fixture or a deadlocked async test before the whole
# CI run wedges. Live-smoke tests are `#[ignore]`'d and only run with
# --ignored; their longest wait is 60s, so the cap doesn't trip them.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# CI: one more retry, run everything even after a failure, and a
# longer slow-test window (120s x 2 = 240s) for slower shared runners.
retries = 2
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }
